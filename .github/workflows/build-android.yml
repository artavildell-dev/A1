name: Build Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Show exact commit
        run: |
          echo "Building commit:"
          git rev-parse HEAD
          git log -1 --oneline

      - name: Build
        run: |
          echo "Android build will be configured here."
