name: Build Artgram Android
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: artgram-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Artgram APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - name: Show project structure
        shell: bash
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
          echo "Workspace: $GITHUB_WORKSPACE"
          echo ""
          echo "Root files:"
          ls -la

          echo ""
          echo "Gradle files:"
          find . -maxdepth 5 -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradlew" \) \
            -not -path "./.git/*" -print

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Artgram project files
        shell: bash
        run: |
          set -e

          if [ ! -f "settings.gradle.kts" ] && \
             [ ! -f "settings.gradle" ]; then
            echo "::error::Missing settings.gradle.kts or settings.gradle in repository root."
            exit 1
          fi

          if [ ! -f "build.gradle.kts" ] && \
             [ ! -f "build.gradle" ]; then
            echo "::error::Missing root build.gradle.kts or build.gradle."
            exit 1
          fi

          if [ ! -f "app/build.gradle.kts" ] && \
             [ ! -f "app/build.gradle" ]; then
            echo "::error::Missing app/build.gradle.kts or app/build.gradle."
            exit 1
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "::error::Missing app/src/main/AndroidManifest.xml."
            exit 1
          fi

          echo "Artgram project files verified."

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -e

          if [ ! -f "gradlew" ]; then
            echo "::error::gradlew is missing from the repository root."
            echo "The project must include the Gradle wrapper."
            exit 1
          fi

          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "::error::Gradle wrapper properties are missing."
            exit 1
          fi

          chmod +x gradlew
          ./gradlew --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK files..."

          find app/build/outputs/apk -type f -name "*.apk" -print

          APK_COUNT=$(find app/build/outputs/apk \
            -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::Build completed without generating an APK."
            exit 1
          fi

          mkdir -p release

          find app/build/outputs/apk \
            -type f -name "*.apk" \
            -exec cp {} release/ \;

          echo ""
          echo "Generated APK files:"
          ls -lh release/

          sha256sum release/*.apk

      - name: Upload Artgram APK
        uses: actions/upload-artifact@v4
        with:
          name: Artgram-Android-${{ github.run_number }}
          path: release/*.apk
          if-no-files-found: error
          retention-days: 14
