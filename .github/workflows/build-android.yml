name: Build AR.AI Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  actions: write

concurrency:
  group: ar-ai-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK and Package Project
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout latest source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true

      - name: Inspect repository
        shell: bash
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Files:"
          find . -maxdepth 4 -type f \
            ! -path './.git/*' | sort | head -300

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Detect Android project
        id: project
        shell: bash
        run: |
          set -e

          ROOT=""

          for DIR in "." "./android" "./app"; do
            if [ -f "$DIR/settings.gradle.kts" ] || \
               [ -f "$DIR/settings.gradle" ]; then
              ROOT="$DIR"
              break
            fi
          done

          if [ -z "$ROOT" ]; then
            SETTINGS=$(find . \
              -type f \
              \( -name settings.gradle.kts \
              -o -name settings.gradle \) \
              ! -path '*/.gradle/*' \
              ! -path '*/build/*' \
              ! -path '*/node_modules/*' \
              -print -quit)

            if [ -n "$SETTINGS" ]; then
              ROOT="${SETTINGS%/*}"
            fi
          fi

          if [ -z "$ROOT" ]; then
            echo "::error::Gradle settings file not found."
            echo "The repository must contain settings.gradle or settings.gradle.kts."
            exit 1
          fi

          ROOT="${ROOT#./}"
          [ -n "$ROOT" ] || ROOT="."

          echo "Project directory: $ROOT"

          if [ ! -f "$ROOT/build.gradle.kts" ] && \
             [ ! -f "$ROOT/build.gradle" ]; then
            echo "::error::Root build.gradle(.kts) not found in $ROOT"
            exit 1
          fi

          if [ ! -f "$ROOT/app/build.gradle.kts" ] && \
             [ ! -f "$ROOT/app/build.gradle" ]; then
            echo "::error::Android app module not found at $ROOT/app"
            echo "Check the actual module directory in settings.gradle."
            exit 1
          fi

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.root }}
        run: |
          set -e
          cd "$PROJECT_ROOT"

          gradle --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Collect APK
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.root }}
        run: |
          set -e
          mkdir -p release

          APK=$(find "$PROJECT_ROOT" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "::error::Build finished without a debug APK."
            exit 1
          fi

          cp "$APK" release/AR-AI-debug.apk
          echo "APK collected successfully."

      - name: Package complete source
        shell: bash
        run: |
          set -e

          zip -r release/AR-AI-full-source.zip . \
            -x './.git/*' \
               './.gradle/*' \
               '*/.gradle/*' \
               '*/build/*' \
               './release/*' \
               './node_modules/*'

          test -s release/AR-AI-full-source.zip

      - name: Upload APK and source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AR-AI-${{ github.sha }}
          path: |
            release/AR-AI-debug.apk
            release/AR-AI-full-source.zip
          if-no-files-found: error
          retention-days: 14
