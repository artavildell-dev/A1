name: Build AR.AI Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build APK and Package Project
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout latest source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify project files
        shell: bash
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Project files:"
          find . -maxdepth 4 -type f \
            ! -path './.git/*' | sort | head -300

          if [ ! -f "android/app/build.gradle.kts" ]; then
            echo "::error::android/app/build.gradle.kts not found."
            exit 1
          fi

          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "::error::AndroidManifest.xml not found."
            exit 1
          fi

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK="$(find android/app/build/outputs/apk/debug \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/AR-AI-debug.apk
          echo "path=release/AR-AI-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Package all project source files
        shell: bash
        run: |
          mkdir -p release

          zip -r release/AR-AI-full-source.zip . \
            -x ".git/*" \
               "android/.gradle/*" \
               "android/**/build/*" \
               "release/*"

      - name: Upload APK and source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AR-AI-${{ github.sha }}
          path: |
            release/AR-AI-debug.apk
            release/AR-AI-full-source.zip
          if-no-files-found: error
          retention-days: 14
